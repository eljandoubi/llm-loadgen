[package]
name = "llm-loadgen"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Open-loop load generator for OpenAI-compatible streaming endpoints, with no dependencies"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/eljandoubi/llm-loadgen"
keywords = ["load-testing", "llm", "latency", "benchmark", "sse"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# casts between integers and floats are everywhere in latency arithmetic and are checked by tests
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
